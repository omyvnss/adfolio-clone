name: mnmm-sync

# Scrapes the top 5 newest sites from mnmm.xyz and pushes them
# to the marketplace API.
#
# Schedule note: 18:15 UTC == 23:45 IST (11:45 PM IST daily).

on:
  schedule:
    - cron: "15 18 * * *" # 11:45 PM IST daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: mnmm-sync
  cancel-in-progress: false

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet -r scripts/requirements.txt

      - name: Scrape top 5 and push to marketplace
        env:
          MARKETPLACE_API_URL: ${{ secrets.MARKETPLACE_API_URL }}
          API_KEY: ${{ secrets.MARKETPLACE_API_KEY }}
        run: python scripts/scrape_and_sync.py
